name: Android build and release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate private build inputs
        env:
          HOME_SDK_URL: ${{ secrets.HOME_SDK_URL }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$HOME_SDK_URL" || (echo "Missing HOME_SDK_URL" && exit 1)
          test -n "$RELEASE_KEYSTORE_BASE64" || (echo "Missing RELEASE_KEYSTORE_BASE64" && exit 1)
      - name: Install Google Home SDK
        env:
          HOME_SDK_URL: ${{ secrets.HOME_SDK_URL }}
          HOME_SDK_TOKEN: ${{ secrets.HOME_SDK_TOKEN }}
        run: |
          if [ -n "$HOME_SDK_TOKEN" ]; then
            curl --fail --location --header "Authorization: Bearer $HOME_SDK_TOKEN" "$HOME_SDK_URL" --output home-sdk.zip
          else
            curl --fail --location "$HOME_SDK_URL" --output home-sdk.zip
          fi
          mkdir -p .home-sdk-repo
          unzip -q home-sdk.zip -d .home-sdk-repo
      - name: Restore release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: home-climate-monitor-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --generate-notes --title "Home Climate Monitor $GITHUB_REF_NAME"
