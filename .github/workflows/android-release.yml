name: Android build and release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Check whether automatic signing is configured
        id: signing
        env:
          HOME_SDK_URL: ${{ secrets.HOME_SDK_URL }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ready=true
          for name in HOME_SDK_URL RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then ready=false; fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo "::notice::Automatic signing is not configured. Tag builds are skipped; locally signed APKs can be uploaded manually."
          fi
  build:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Install required Android SDK components
        run: bash .github/scripts/install-android-components.sh
      - name: Validate private build inputs and tag
        env:
          HOME_SDK_URL: ${{ secrets.HOME_SDK_URL }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash .github/scripts/validate-release.sh
      - name: Install checksum-verified Google Home SDK
        env:
          HOME_SDK_URL: ${{ secrets.HOME_SDK_URL }}
          HOME_SDK_TOKEN: ${{ secrets.HOME_SDK_TOKEN }}
        run: python3 .github/scripts/install-home-sdk.py
      - name: Test and lint the full app before restoring the signing key
        run: ./gradlew testDebugUnitTest lintRelease --console=plain
      - name: Restore release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
      - name: Verify signer, notices and package release assets
        run: python3 .github/scripts/package-release.py
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: app/build/release-assets/
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signed-release
          path: release-assets
      - name: Verify uploaded assets and publish a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum --check *.apk.sha256
          gh release create "$GITHUB_REF_NAME" *.apk *.apk.sha256 --verify-tag --prerelease --notes-file "../docs/releases/$GITHUB_REF_NAME.md" --title "Nest Climate Monitor $GITHUB_REF_NAME"
