name: Publication privacy check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check source and commit history
        run: python3 .github/scripts/check-publication.py --history
      - name: Check Kotlin documentation coverage
        run: python3 .github/scripts/check-documentation.py
      - name: Test build-maintenance helpers
        run: python3 -m unittest discover -s .github/tests -v
