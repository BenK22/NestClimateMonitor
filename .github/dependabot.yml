version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Signed-in Home SDK cannot be upgraded from public Maven metadata.
      - dependency-name: com.google.android.gms:play-services-home
      - dependency-name: com.google.android.gms:play-services-home-types
